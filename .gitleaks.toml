# Gitleaks: regras padrão + regra do projeto para segredos JWT.
title = "Ford Ranger Raptor - secret scanning"

[extend]
useDefault = true

[[rules]]
id = "ford-jwt-secret"
description = "JWT_SECRET com valor atribuído"
regex = '''(?i)JWT_SECRET\s*[=:]\s*['"]?[A-Za-z0-9_\-+/]{16,}'''
keywords = ["jwt_secret"]

[allowlist]
description = "Arquivos sem segredo real"
paths = [
  '''server/test/helpers\.js''',       # segredo fixo só para testes automatizados
  '''package-lock\.json''',
  '''server/package-lock\.json''',
  '''server/data/catalog\.json''',
]
